<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HUFT EQ{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <span class="paw">🐾</span>
      <h1>HUFT EQ</h1>
      <small>Customer Care · Care Intelligence</small>
    </div>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' else '' }}">Upload</a>
      <a href="{{ url_for('overview') }}" class="{{ 'active' if request.endpoint == 'overview' else '' }}">Overview</a>
      {% if session.get('authed') %}<a href="{{ url_for('logout') }}" class="logout">Log out</a>{% endif %}
    </nav>
  </div>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
